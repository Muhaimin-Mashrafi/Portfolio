name: Sync GitHub projects

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write # commit src/data/generated/projects.json
  actions: write # start the deploy workflow

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Sync repositories
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read-only use against the public API; never logged
        run: pnpm sync:projects
        # If the sync fails, the step fails visibly and projects.json is left exactly as it was.

      - name: Validate and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- src/data/generated/projects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "portfolio-sync[bot]"
            git config user.email "portfolio-sync@users.noreply.github.com"
            git add src/data/generated/projects.json
            git commit -m "chore: sync GitHub project data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the default GITHUB_TOKEN does not start other workflows, but a manual-dispatch request does,
      # so the site rebuild is requested explicitly.
      - name: Trigger rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
